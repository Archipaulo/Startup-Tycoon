<script>
(function(){
  function show(msg){ var e=document.getElementById('err'); if(e){ e.style.display='block'; e.textContent='⚠️ '+msg; } }
  window.__show=show;
  window.addEventListener('error', function(ev){ show('Erreur : '+((ev.error&&ev.error.stack)||ev.message||'?')); });
  window.addEventListener('unhandledrejection', function(ev){ show('Erreur : '+((ev.reason&&ev.reason.message)||ev.reason)); });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if (typeof React==='undefined' || typeof Babel==='undefined'){
        show("React n'a pas pu se charger.\n\nCa arrive quand le fichier est ouvert sans connexion internet, ou dans un environnement qui bloque les scripts externes (comme l'apercu du chat).\n\nDeploie le fichier (Netlify Drop / GitHub Pages) et ouvre l'adresse, ou ouvre-le dans un vrai navigateur avec internet.");
        return;
      }
      var r=document.getElementById('root');
      if (r && r.children.length===0){ show("Le jeu ne s'est pas affiche (root vide). Si tu es dans l'apercu du chat, c'est normal : telecharge le fichier et ouvre-le dans Safari/Chrome, ou deploie-le."); }
    }, 3000);
  });
})();
</script>

function getStartup(i) {
  if (i < BASE_STARTUPS.length) return BASE_STARTUPS[i];
  const t = i - BASE_STARTUPS.length;          // 0, 1, 2...
  const g = GEN_NAMES[t % GEN_NAMES.length];
  const cycle = Math.floor(t / GEN_NAMES.length) + 1;
  const base = 1e9 * Math.pow(12, t + 1);      // coût de stat qui explose
  const inc = 1e5 * Math.pow(10, t + 1);       // revenu qui explose
  return {
    id: `s${i}`, emoji: g.emoji,
    name: cycle > 1 ? `${g.name} ${cycle}` : g.name,
    cost: 7e9 * Math.pow(12, t + 1), unlockNextAt: 25,

const passCumXP = (L) => L + (L * (L + 1)) / 2;     // coût du niveau n = n+1 (donc gaps 2,3,4,5...)
function passLevelFromXP(xp) {
  let L = 0;
  while (L < PASS_MAX && passCumXP(L + 1) <= xp) L++;
  return L;
}

function fmt(n) {
  if (n < 1000) return n.toFixed(n < 10 && n % 1 !== 0 ? 1 : 0);
  const u = ["K", "M", "B", "T", "Qa"];
  let i = -1, x = n;
  while (x >= 1000 && i < u.length - 1) { x /= 1000; i++; }
  return x.toFixed(x < 10 ? 2 : x < 100 ? 1 : 0) + u[i];
}

function computeIncome(ownedCount, levels) {
  let total = 0;
  for (let i = 0; i < ownedCount; i++) {
    const su = getStartup(i);
    for (const st of su.stats) total += (levels[`${su.id}_${st.id}`] || 0) * st.income;
  }
  return total;
}

  const [achievements, setAchievements] = useState({}); // id -> true
  const [boostUntil, setBoostUntil] = useState(0);  // timestamp de fin du x2
  const [lastAdBoost, setLastAdBoost] = useState(0); // dernier boost pub (cooldown 3h)
  const [adBoostPlaying, setAdBoostPlaying] = useState(false);
  const [, setTick] = useState(0);                  // force le rafraîchissement du temps
  const [dailyModal, setDailyModal] = useState(null);
  const [prestigeModal, setPrestigeModal] = useState(false);
  const [achToast, setAchToast] = useState(null);
  const [loaded, setLoaded] = useState(false);

  const baseIncome = useMemo(() => computeIncome(owned, levels), [owned, levels]);
  const unlockedAch = useMemo(() => Object.keys(achievements).length, [achievements]);
  const boostActive = boostUntil > Date.now();
  const invLvl = perks.inv || 0, clkLvl = perks.clk || 0, offLvl = perks.off || 0, costLvl = perks.cost || 0;
  const availablePts = prestige - perkSpent(perks);
  const costMult = 1 - costLvl * 0.02;               // réduction du coût des stats
  const prestigeMult = 1 + prestige * 0.02;          // +2% par point de prestige (total)
  const achMult = 1 + unlockedAch * 0.03;            // +3% par succès
  const metaMult = (premium ? PREMIUM_MULT : 1) * prestigeMult * achMult * (1 + invLvl * 0.1);
  const incomePerSec = baseIncome * metaMult * (boostActive ? 2 : 1);
  const perClick = Math.max(1, Math.round(incomePerSec * 0.2 * (1 + clkLvl)));
  const offlineRate = (premium ? PREMIUM_OFFLINE_RATE : OFFLINE_RATE) + offLvl * 0.05;
  // Points de prestige gagnés si on revend maintenant
  const ppGain = Math.floor(Math.sqrt(Math.max(0, money) / 1e6)) + Math.max(0, owned - 1);
  const today = Math.floor(Date.now() / 86400000);
  const dailyAvailable = today > (daily.lastDay || 0);
  const adReady = Date.now() - (lastAdBoost || 0) >= AD_INTERVAL && !boostActive;
  const rank = RANKS[Math.min(owned - 1, RANKS.length - 1)];
  const curTheme = THEMES.find((t) => t.id === theme) || THEMES[0];
  const costOf = (st, lvl) => Math.ceil(statCost(st, lvl) * costMult); // coût après réduction "Soldes"
  const totalUpgrades = useMemo(() => Object.values(levels).reduce((a, b) => a + b, 0), [levels]);
  const passLevel = passLevelFromXP(passXP);
  const passInto = passXP - passCumXP(passLevel);                       // XP dans le niveau courant
  const passNeed = passLevel < PASS_MAX ? passCumXP(passLevel + 1) - passCumXP(passLevel) : 1; // XP requise pour le suivant

  const metricValue = (m) =>
    m === "money" ? money : m === "upgrades" ? totalUpgrades : m === "owned" ? owned : m === "clicks" ? clicks : m === "income" ? incomePerSec : 0;

  // Une seule ref qui contient tout l'état à sauvegarder
  const stateRef = useRef({});
  stateRef.current = { money, owned, levels, clicks, premium, passXP, claimedLevel, questTier, questDone, prestige, perks, daily, achievements, lastAdBoost, theme, themesOwned, holdings };
  const incRef = useRef(0); incRef.current = incomePerSec;

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.value) {
          const s = JSON.parse(r.value);
          if (s.lastSeen) {
            const el = Math.min((Date.now() - s.lastSeen) / 1000, OFFLINE_CAP);
            const achCount = s.achievements ? Object.keys(s.achievements).length : 0;
            const pk = s.perks || {};
            const mult = (s.premium ? PREMIUM_MULT : 1) * (1 + (s.prestige || 0) * 0.02) * (1 + achCount * 0.03) * (1 + (pk.inv || 0) * 0.1);
            const rate = (s.premium ? PREMIUM_OFFLINE_RATE : OFFLINE_RATE) + (pk.off || 0) * 0.05;
            const earned = computeIncome(s.owned || 1, s.levels || {}) * mult * el * rate;
            if (earned > 1) setOffline({ earned, sec: el });
          }
          setMoney(s.money || 0); setOwned(s.owned || 1); setLevels(s.levels || {});
          setClicks(s.clicks || 0); setPremium(!!s.premium); setPassXP(s.passXP || 0);
          setClaimedLevel(s.claimedLevel || 0); setQuestTier(s.questTier || {}); setQuestDone(s.questDone || {});
          setPrestige(s.prestige || 0); setDaily(s.daily || { lastDay: 0, streak: 0 });
          setAchievements(s.achievements || {}); setLastAdBoost(s.lastAdBoost || 0);
          setPerks(s.perks || {});
          setTheme(s.theme || "emeraude"); setThemesOwned(s.themesOwned || { emeraude: true });
          setHoldings(s.holdings || {});
        }
      } catch (e) {}
      try {
        const p = await window.storage.get(PROFILE_KEY);
        if (p && p.value) setProfile(JSON.parse(p.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  function save() {
    try { window.storage.set(STORAGE_KEY, JSON.stringify({ ...stateRef.current, lastSeen: Date.now() })); } catch (e) {}
  }

  useEffect(() => {
    const t = setInterval(() => { if (incRef.current > 0) setMoney((m) => m + incRef.current / 10); }, 100);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const t = setInterval(save, 5000);
    return () => { clearInterval(t); save(); };
  }, [loaded]);
  useEffect(() => { if (loaded) save(); }, [owned, levels, premium, passXP, questTier, questDone, prestige, perks, daily, achievements, lastAdBoost, theme, themesOwned, holdings]);

  // Récompense automatique à chaque niveau de Pass gagné
  useEffect(() => {
    if (!loaded) return;
    if (passLevel > claimedLevel) {
      let reward = 0;
      for (let t = claimedLevel + 1; t <= passLevel; t++) reward += freeReward(t) + (premium ? premReward(t) : 0);
      setMoney((m) => m + reward);
      setClaimedLevel(passLevel);
      setPassToast({ levels: passLevel - claimedLevel, reward });
      setTimeout(() => setPassToast(null), 3500);
    }
  }, [passXP, loaded]);

  // Succès : déblocage automatique quand la condition est remplie
  useEffect(() => {
    if (!loaded) return;
    const g = { owned, money, clicks, upgrades: totalUpgrades, premium, prestige };
    let newly = null;
    const updated = { ...achievements };
    for (const a of ACHIEVEMENTS)
      if (!updated[a.id] && a.check(g)) { updated[a.id] = true; if (!newly) newly = a; }
    if (newly) { setAchievements(updated); setAchToast(newly); setTimeout(() => setAchToast(null), 3500); }
  }, [owned, money, clicks, totalUpgrades, premium, prestige, achievements, loaded]);

  // Fin du boost x2 : à l'expiration on remet à 0 (force le recalcul du revenu)
  useEffect(() => {
    if (boostUntil <= Date.now()) return;
    const t = setTimeout(() => setBoostUntil(0), boostUntil - Date.now() + 60);
    return () => clearTimeout(t);
  }, [boostUntil]);

  // Rafraîchit l'UI liée au temps (réapparition du bouton pub toutes les 3h)
  useEffect(() => {
    const t = setInterval(() => setTick((n) => n + 1), 20000);
    return () => clearInterval(t);
  }, []);

  // Bourse : les cours bougent en marche aléatoire toutes les 2,5s
  const pricesRef = useRef({}); pricesRef.current = prices;
  useEffect(() => {
    const t = setInterval(() => {
      const cur = pricesRef.current;
      const next = {};
      STOCKS.forEach((s) => {
        const p0 = cur[s.id] ?? s.base;
        const shock = (Math.random() * 2 - 1) * s.vol;          // ±volatilité
        const pull = ((s.base - p0) / s.base) * 0.03;           // léger rappel vers la base
        next[s.id] = Math.max(s.base * 0.2, Math.round(p0 * (1 + shock + pull) * 100) / 100);
      });
      setPrices(next);
      setHist((h) => {
        const nh = {};
        STOCKS.forEach((s) => { nh[s.id] = [...(h[s.id] || [s.base]), next[s.id]].slice(-24); });
        return nh;
      });
    }, 2500);
    return () => clearInterval(t);
  }, []);

  function work(e) {
    setMoney((m) => m + perClick);
    setClicks((c) => c + 1);
    const rect = e.currentTarget.getBoundingClientRect();
    const id = Math.random();
    setFloats((f) => [...f, { id, x: e.clientX - rect.left, y: e.clientY - rect.top, val: perClick }]);
    setTimeout(() => setFloats((f) => f.filter((o) => o.id !== id)), 850);
  }
  function buyStat(su, st) {
    const key = `${su.id}_${st.id}`;
    const c = costOf(st, levels[key] || 0);
    if (money < c) return;
    setMoney((m) => m - c);
    setLevels((p) => ({ ...p, [key]: (p[key] || 0) + 1 }));
  }
  function buyStartup() {
    const nx = owned < MAX_STARTUPS ? getStartup(owned) : null;
    if (!nx || money < nx.cost) return;
    setMoney((m) => m - nx.cost);
    setOwned((o) => o + 1);
  }
  function claimQuest(q) {
    const tier = questTier[q.id] || 0;
    if (tier >= q.targets.length || metricValue(q.metric) < q.targets[tier]) return;
    setPassXP((x) => x + q.xp[tier]);
    setQuestTier((p) => ({ ...p, [q.id]: tier + 1 }));
  }
  function claimObjective(obj) {
    if (questDone[obj.id]) return;
    const g = { owned, money, premium, prestige, levels, holdings, themesOwned };
    if (!obj.check(g)) return;
    setPassXP((x) => x + obj.xp);
    setQuestDone((p) => ({ ...p, [obj.id]: true }));
  }
  function collect(mult) {
    if (!offline) return;
    const amount = offline.earned * mult;
    setMoney((m) => m + amount);
    setOffline(null); setAdPlaying(false);
    setCollectFx({ amount });
    setTimeout(() => setCollectFx(null), 1300);
  }
  function watchAd() { setAdPlaying(true); setTimeout(() => collect(2), 3000); }

  function watchAdBoost() {
    if (!adReady) return;
    setAdBoostPlaying(true);
    setTimeout(() => {
      setBoostUntil(Date.now() + AD_BOOST_MS);
      setLastAdBoost(Date.now());
      setAdBoostPlaying(false);

  }

  function doPrestige() {
    if (ppGain < 1) return;
    setPrestige((p) => p + ppGain);
    setMoney(0); setOwned(1); setLevels({}); setClicks(0);
    setOffline(null); setBoostUntil(0);
    setPrestigeModal(false); setPage("startups");
  }
  function buyPerk(perk) {
    const lvl = perks[perk.id] || 0;
    if (lvl >= perk.max) return;
    const cost = lvl + 1;
    if (availablePts < cost) return;
    setPerks((p) => ({ ...p, [perk.id]: (p[perk.id] || 0) + 1 }));
  }
  function chooseTheme(t) {
    if (themesOwned[t.id]) { setTheme(t.id); return; }
    if (money < t.cost) return;
    setMoney((m) => m - t.cost);
    setThemesOwned((o) => ({ ...o, [t.id]: true }));
    setTheme(t.id);
  }
  function buyStock(id, qty) {
    const cost = (prices[id] || 0) * qty;
    if (money < cost) return;
    setMoney((m) => m - cost);
    setHoldings((h) => ({ ...h, [id]: (h[id] || 0) + qty }));
  }
  function sellStock(id, qty) {
    const own = holdings[id] || 0;
    const q = Math.min(qty, own);
    if (q <= 0) return;
    setMoney((m) => m + (prices[id] || 0) * q);
    setHoldings((h) => ({ ...h, [id]: own - q }));
  }

    if (!dailyAvailable) { setDailyModal({ claimed: true }); return; }

    const reward = Math.max(1000, Math.round(incomePerSec * 120)) * newStreak;
    setDailyModal({ streak: newStreak, reward });
  }

    if (!dailyModal || dailyModal.claimed) return;
    setMoney((m) => m + dailyModal.reward);

    setCollectFx({ amount: dailyModal.reward });
    setTimeout(() => setCollectFx(null), 1300);
    setDailyModal(null);
  }
  function buyPremium() { setPremium(true); setShowStore(false); }
  function login(provider, pseudo) {

    const p = { provider, name };
    setProfile(p);
    try { window.storage.set(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}

  }

  const next = owned < MAX_STARTUPS ? getStartup(owned) : null;
  const prev = getStartup(owned - 1);

  const eligible = next ? prevLevel >= prev.unlockNextAt : false;

                <button className={"buy " + (money >= next.cost ? "on" : "off")} disabled={money < next.cost} onClick={buyStartup}>
                  Acheter pour {fmt(next.cost)} €
                </button>
              </>
            )}
          </div>
        )}
        {!next && <div className="su lock"><div className="emo">👑</div><div className="nm">Empire complet !</div></div>}

        <div className="foot"><button className="reset" onClick={reset}>↺ Tout recommencer</button></div>
        </>)}

        {page === "classement" && (() => {
          const pool = board === "france" ? BOARD_FR : BOARD_WORLD;
          const me = { name: profile ? profile.name : "Toi", flag: "🇫🇷", level: totalUpgrades, money, startup: owned, you: true };
          const list = [...pool.map((p) => ({ ...p })), me]
            .sort((a, b) => (boardBy === "money" ? b.money - a.money : boardBy === "startup" ? b.startup - a.startup : b.level - a.level));
          const myRank = list.findIndex((p) => p.you) + 1;
          return (
            <div className="panel">
              <div className="ptitle">🏆 Classement</div>
              <div className="lbtabs">
                <div className="segc">
                  <button className={board === "france" ? "on" : ""} onClick={() => setBoard("france")}>🇫🇷 France</button>
                  <button className={board === "monde" ? "on" : ""} onClick={() => setBoard("monde")}>🌍 Monde</button>
                </div>
                <div className="segc">
                  <button className={boardBy === "level" ? "on" : ""} onClick={() => setBoardBy("level")}>Niveau</button>
                  <button className={boardBy === "money" ? "on" : ""} onClick={() => setBoardBy("money")}>Argent</button>
                  <button className={boardBy === "startup" ? "on" : ""} onClick={() => setBoardBy("startup")}>Startups</button>
                </div>
              </div>
              <div className="lbnote">Ta position : <b>#{myRank}</b> sur {list.length}{board === "monde" ? " (top mondial)" : " (France)"}</div>
              <div className="lblist">
                {list.map((p, i) => {
                  const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`;
                  return (
                    <div className={"lbrow" + (p.you ? " you" : "")} key={p.name + i}>
                      <span className="lbrank">{medal}</span>
                      <span className="lbflag">{p.flag}</span>
                      <span className="lbname">{p.name}{p.you ? " (toi)" : ""}</span>
                      <span className="lbscore">{boardBy === "money" ? fmt(p.money) + " €" : boardBy === "startup" ? "Startup n°" + p.startup : "Niv. " + Math.floor(p.level)}</span>
                    </div>
                  );
                })}
              </div>
              <div className="lbdisc">🔒 Démo : les autres joueurs sont simulés. Un vrai classement mondial nécessiterait un serveur partagé.</div>
            </div>
          );
        })()}

        {page === "prestige" && (
          <div className="panel">
            <div className="ptitle">🔄 Prestige</div>
            <div className="prestat">
              <div><div className="pk">Points dispo</div><div className="pv gold">{availablePts}</div></div>
              <div><div className="pk">Bonus de base</div><div className="pv">+{Math.round(prestige * 2)}%</div></div>
              <div><div className="pk">Total gagné</div><div className="pv">{prestige}</div></div>
            </div>
            <p className="prestxt">Revends tout ton empire à des investisseurs. Tu repars de zéro (argent et startups remis à plat), mais tu gardes tes <b>points de prestige</b> à dépenser ci-dessous, et un bonus de base permanent.</p>
            <div className="presgain">En revendant maintenant : <b>+{ppGain}</b> point{ppGain > 1 ? "s" : ""} de prestige</div>
            <button className={"presbtn " + (ppGain >= 1 ? "on" : "off")} disabled={ppGain < 1} onClick={() => setPrestigeModal(true)}>
              {ppGain >= 1 ? "💼 Revendre l'empire" : "Progresse encore pour pouvoir revendre"}
            </button>

            <div className="ptitle" style={{ marginTop: 22 }}>🌳 Arbre de prestige</div>
            <div className="achlist">
              {PERKS.map((perk) => {
                const lvl = perks[perk.id] || 0;
                const maxed = lvl >= perk.max;
                const cost = lvl + 1;
                const can = !maxed && availablePts >= cost;
                return (
                  <div className={"ach" + (lvl > 0 ? " got" : "")} key={perk.id}>
                    <span className="ache">{perk.emoji}</span>
                    <div className="achmid">
                      <div className="achn">{perk.name} <span style={{ color: "#6E8478", fontWeight: 400 }}>niv. {lvl}/{perk.max}</span></div>
                      <div className="achd">{perk.desc}</div>
                    </div>
                    {maxed ? (
                      <span className="achok">MAX</span>
                    ) : (
                      <button className={"qclaim" + (can ? "" : " off2")} disabled={!can} onClick={() => buyPerk(perk)}>
                        {cost} pt{cost > 1 ? "s" : ""}
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {page === "succes" && (
          <div className="panel">
            <div className="ptitle">🏅 Succès · +3% de revenus chacun</div>
            <div className="achlist">
              {ACHIEVEMENTS.map((a) => {
                const got = !!achievements[a.id];
                return (
                  <div className={"ach" + (got ? " got" : "")} key={a.id}>
                    <span className="ache">{got ? a.emoji : "🔒"}</span>
                    <div className="achmid">
                      <div className="achn">{a.name}</div>
                      <div className="achd">{a.desc}</div>
                    </div>
                    {got && <span className="achok">✓</span>}
                  </div>
                );
              })}
            </div>
            <div className="lbdisc">Débloqués : {unlockedAch}/{ACHIEVEMENTS.length} · bonus actuel +{unlockedAch * 3}%</div>
          </div>
        )}

        {page === "boutique" && (
          <div className="panel">
            <div className="ptitle">🎨 Thèmes</div>
            <div className="lbdisc" style={{ marginTop: 0, marginBottom: 14 }}>Change l'ambiance du jeu. Cosmétique uniquement — aucun avantage de jeu, juste du style.</div>
            <div className="themegrid">
              {THEMES.map((t) => {
                const ownedT = !!themesOwned[t.id];
                const active = theme === t.id;
                const canBuy = ownedT || money >= t.cost;
                return (
                  <div className={"themecard" + (active ? " active" : "")} key={t.id}
                    style={{ background: `linear-gradient(150deg, ${t.bg}, ${t.deep})` }}>
                    <div className="themedots">
                      <span style={{ background: t.accent }} />
                      <span style={{ background: t.bright }} />
                      <span style={{ background: "#FBBF24" }} />
                    </div>
                    <div className="themename">{t.name}</div>
                    <button className={"themebtn" + (canBuy ? "" : " off")} disabled={!canBuy && !ownedT}
                      onClick={() => chooseTheme(t)}
                      style={ownedT ? { background: t.accent, color: t.bg } : {}}>
                      {active ? "✓ Actif" : ownedT ? "Choisir" : `Débloquer · ${fmt(t.cost)} €`}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {page === "bourse" && (() => {
          const portfolio = STOCKS.reduce((s, st) => s + (holdings[st.id] || 0) * (prices[st.id] || 0), 0);
          return (
            <div className="panel">
              <div className="ptitle">📈 Bourse</div>
              <div className="prestat" style={{ marginBottom: 14 }}>
                <div><div className="pk">Portefeuille</div><div className="pv gold">{fmt(portfolio)} €</div></div>
                <div><div className="pk">Liquidités</div><div className="pv">{fmt(money)} €</div></div>
              </div>
              <div className="stocklist">
                {STOCKS.map((st) => {
                  const h = hist[st.id] || [st.base];
                  const price = prices[st.id] || st.base;
                  const prevP = h.length > 1 ? h[h.length - 2] : price;
                  const pct = prevP ? ((price - prevP) / prevP) * 100 : 0;
                  const up = pct >= 0;
                  const own = holdings[st.id] || 0;
                  return (
                    <div className="stock" key={st.id}>
                      <span className="stockemo">{st.emoji}</span>
                      <div className="stockmid">
                        <div className="stockname">{st.name} {own > 0 && <span className="stockown">×{own}</span>}</div>
                        <div className="stockprice">
                          {fmt(price)} € <span className={"stockpct " + (up ? "up" : "down")}>{up ? "▲" : "▼"} {Math.abs(pct).toFixed(1)}%</span>
                        </div>
                      </div>
                      <Spark data={h} up={up} />
                      <div className="stockbtns">
                        <button className={"sbtn buy" + (money >= price ? "" : " off")} disabled={money < price} onClick={() => buyStock(st.id, 1)}>Acheter</button>
                        <button className={"sbtn sell" + (own > 0 ? "" : " off")} disabled={own <= 0} onClick={() => sellStock(st.id, own)}>Vendre</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="lbdisc" style={{ marginTop: 14 }}>Les cours montent et descendent en temps réel. Achète bas, revends haut… mais tu peux aussi perdre. « Vendre » liquide toute ta position.</div>
            </div>
          );
        })()}
      </div>

      {offline && (
        <div className="modal">
          <div className="sheet">
            <div className="welicon">💤</div>
            <div className="weltitle">Bon retour !</div>
            <div className="welsub">Absent pendant {fmtDuration(offline.sec)}</div>
            <div className="welamount">+{fmt(offline.earned)} €</div>
            <div className="welnote">{Math.round(offlineRate * 100)} % de ton revenu hors-ligne (max 3 jours)</div>
            <button className="welbtn primary" onClick={() => collect(1)}>Récupérer</button>
            <button className="welbtn ad" onClick={watchAd}>Récupérer ×2 · 📺 Regarder une pub</button>
          </div>
          {adPlaying && (
            <div className="adscreen">
              <div className="adspin" />
              <div className="adtxt">Pub en cours…</div>
              <div className="adsub">(simulation — un vrai jeu afficherait ici une vraie pub via un SDK type AdMob)</div>
            </div>
          )}
        </div>
      )}

      {showStore && (
        <div className="modal">
          <div className="sheet">
            <div className="welicon">⭐</div>
            <div className="weltitle">Pass Premium</div>
            <ul className="perks">
              <li>🚀 <span><b>+25 %</b> de revenus en permanence</span></li>
              <li>💤 Gains hors-ligne à <b>50 %</b> (au lieu de 25 %)</li>
              <li>🎁 Récompenses du Pass <b>doublées</b></li>
            </ul>
            <button className="welbtn gold" onClick={buyPremium}>Activer (simulation)</button>
            <button className="welbtn ghost" onClick={() => setShowStore(false)}>Plus tard</button>
            <div className="welnote" style={{ marginTop: 12, marginBottom: 0 }}>Démo : aucun vrai paiement. Un vrai achat passerait par Stripe ou les stores.</div>
          </div>
        </div>
      )}

      {passToast && (
        <div className="toast">⭐ Pass niveau +{passToast.levels} ! Récompense : +{fmt(passToast.reward)} €</div>
      )}

      {achToast && (
        <div className="toast ach">🏅 Succès débloqué : {achToast.emoji} {achToast.name} (+3%)</div>
      )}

      {dailyModal && (
        <div className="modal" onClick={() => setDailyModal(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="welicon">🎁</div>
            <div className="weltitle">Récompense quotidienne</div>
            {dailyModal.claimed ? (
              <>
                <div className="welnote" style={{ margin: "14px 0 20px" }}>Déjà réclamée aujourd'hui. Reviens demain pour continuer ta série !</div>
                <button className="welbtn primary" onClick={() => setDailyModal(null)}>OK</button>
              </>
            ) : (
              <>
                <div className="welsub">Série : {dailyModal.streak} jour{dailyModal.streak > 1 ? "s" : ""} 🔥</div>
                <div className="welamount">+{fmt(dailyModal.reward)} €</div>
                <div className="welnote">Reviens chaque jour pour une récompense de plus en plus grosse.</div>
                <button className="welbtn primary" onClick={claimDaily}>Réclamer</button>
              </>
            )}
          </div>
        </div>
      )}

      {prestigeModal && (
        <div className="modal">
          <div className="sheet">
            <div className="welicon">🔄</div>
            <div className="weltitle">Revendre l'empire ?</div>
            <div className="welnote" style={{ margin: "12px 0 18px" }}>
              Tu vas perdre ton argent et tes startups, mais gagner <b style={{ color: "#FBBF24" }}>+{ppGain} point{ppGain > 1 ? "s" : ""} de prestige</b> (bonus permanent de +{Math.round((prestige + ppGain) * 2)}% au total).
            </div>
            <button className="welbtn gold" onClick={doPrestige}>Confirmer la revente</button>
            <button className="welbtn ghost" onClick={() => setPrestigeModal(false)}>Annuler</button>
          </div>
        </div>
      )}

      {adBoostPlaying && (
        <div className="modal">
          <div className="sheet">
            <div className="adspin" style={{ margin: "4px auto 16px" }} />
            <div className="adtxt">Pub en cours…</div>
            <div className="adsub" style={{ marginTop: 8 }}>(simulation) Ton boost ×2 arrive juste après !</div>
          </div>
        </div>
      )}
    </div>
  );
}

// Mini graphique (sparkline) pour la bourse
function Spark({ data, up }) {
  const w = 64, h = 30;
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / Math.max(1, data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ flexShrink: 0 }}>
      <polyline points={pts} fill="none" stroke={up ? "#34D399" : "#F87171"} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

          Une vraie connexion Google/Facebook/iCloud nécessite un serveur d'authentification.</div>
      </div>

  );
}

try {
